name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      # Lint skipped: typescript-eslint doesn't support TS7 yet
      # See: https://github.com/typescript-eslint/typescript-eslint/issues/10940

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: farmsense-frontend/package-lock.json

      - name: Install dependencies
        working-directory: farmsense-frontend
        run: npm ci

      - name: Lint
        working-directory: farmsense-frontend
        run: npm run lint

      - name: Build
        working-directory: farmsense-frontend
        run: npm run build

  ai:
    name: AI Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        working-directory: ai
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint
        working-directory: ai
        run: |
          pip install ruff
          ruff check .

      - name: Test
        working-directory: ai
        run: pytest -v
