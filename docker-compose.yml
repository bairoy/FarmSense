version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_OR_ANON_KEY=${SUPABASE_PUBLISHABLE_OR_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AI_SERVICE_URL=http://ai:8000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Selects regions/<name>.json - the Kc curves, GDD boundaries, soil TAW,
      # land-unit ladder and fertilizer rates the whole engine runs on.
      - DEFAULT_REGION=${DEFAULT_REGION:-gorakhpur}
      # Optional integrations
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      # Must be R2_BUCKET: that is the name config/env.ts reads. Passing
      # R2_BUCKET_NAME left the bucket on its default while every credential
      # was set, so uploads failed only at runtime, only in the container.
      - R2_BUCKET=${R2_BUCKET:-farmsense-images}
      - CDSE_CLIENT_ID=${CDSE_CLIENT_ID:-}
      - CDSE_CLIENT_SECRET=${CDSE_CLIENT_SECRET:-}
    depends_on:
      - ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./farmsense-frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5050/api}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  ai:
    build: ./ai
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}
      - BACKEND_URL=http://backend:5050
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - CONFIDENCE_GATE=${CONFIDENCE_GATE:-0.70}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
